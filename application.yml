app:
  jwt:
    secret: ${JWT_SECRET:local-dev-secret-key-for-social-platform-must-be-at-least-256-bits-long!}
    access-ttl-seconds: 900
  internal-api-token: ${INTERNAL_API_TOKEN:local-internal-dev-token}

spring:
  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  metrics:
    tags:
      application: ${spring.application.name}

eureka:
  client:
    enabled: ${EUREKA_CLIENT_ENABLED:false}
