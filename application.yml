app:
  jwt:
    secret: ${JWT_SECRET:BRfGQcy+vGYTMvJfyop45BnjVnI841wQC6+jfXERtqI=}
    access-ttl-seconds: 900

spring:
  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  metrics:
    tags:
      application: ${spring.application.name}

eureka:
  client:
    enabled: ${EUREKA_CLIENT_ENABLED:false}
