server:
  port: ${SERVER_PORT:8080}

spring:
  cloud:
    gateway:
      routes:
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/users/**,/api/auth/**,/internal/users/**

        - id: post-service
          uri: lb://post-service
          predicates:
            - Path=/api/posts/**

        - id: feed-service
          uri: lb://feed-service
          predicates:
            - Path=/api/feed/**

        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/api/notifications/**
